<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>60-Day Technical Analysis Mastery Challenge</title><style>:root{--navy:#14263D;--green:#285943;--cream:#F8F5EE;--gold:#C5A46D;--ink:#202A35;--line:#d9d2c3;--white:#fff;--warn:#8a2f2f}
*{box-sizing:border-box}html{font-size:17px}body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.55}
a{color:var(--green)}a:hover{color:var(--navy)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--navy);color:#fff;padding:.6rem 1rem;z-index:99}.skip:focus{left:0}
#top{background:var(--navy);color:#fff;padding:.6rem 1rem;position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center}
.brand a{color:#fff;font-weight:bold;text-decoration:none;font-size:1.05rem}
.savestate{font:.78rem system-ui,sans-serif;color:#cfd8e3;margin-left:auto}.savestate.bad{color:#ffd0d0;font-weight:bold}
#nav{display:flex;flex-wrap:wrap;gap:.15rem;width:100%}
#nav a{color:#e8edf3;text-decoration:none;font:.85rem system-ui,sans-serif;padding:.3rem .55rem;border-radius:5px}
#nav a:hover{background:#26405e}#nav a.on{background:var(--gold);color:var(--navy);font-weight:bold}
#app{max-width:960px;margin:0 auto;padding:1rem 1rem 3rem}
#foot{max-width:960px;margin:0 auto;padding:1rem;font:.78rem system-ui,sans-serif;color:#4a5562;border-top:1px solid var(--line)}
h1{color:var(--navy);font-size:1.7rem;line-height:1.2;margin:.3rem 0 .6rem}h2{color:var(--navy);font-size:1.25rem;margin:.2rem 0 .6rem}h3{color:var(--green);font-size:1.05rem}
.card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:1rem 1.15rem;margin:0 0 1rem}
.card.hero{border-top:6px solid var(--green)}.card.accent{border-left:6px solid var(--gold)}.card.warn{border-left:6px solid var(--warn)}
.eyebrow{font:.8rem system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.tag{font-style:italic;color:var(--green);margin:.1rem 0}.philosophy{border-left:4px solid var(--gold);padding-left:.8rem;color:var(--navy)}
.muted{color:#4a5562}.small{font-size:.85rem}.big{font-size:1.2rem;font-weight:bold}.ok{color:var(--green);font-weight:bold}.warn{color:var(--warn)}
.banner{background:#fbf1d9;border:1px solid var(--gold);border-radius:8px;padding:.7rem .9rem;font-size:.92rem}
.disclaimer{margin-top:1.5rem}
.btn{display:inline-block;font:.92rem system-ui,sans-serif;background:var(--white);color:var(--navy);border:2px solid var(--navy);border-radius:7px;padding:.5rem .9rem;cursor:pointer;text-decoration:none;margin:.15rem .15rem .15rem 0}
.btn:hover{background:#eef1f5}.btn.primary{background:var(--navy);color:#fff}.btn.primary:hover{background:#0d1a2b}.btn.small{padding:.25rem .6rem;font-size:.82rem}.btn.big{font-size:1.05rem;padding:.65rem 1.2rem}
.btn[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.btnrow{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin:.5rem 0}
textarea,input[type=text],input[type=number],input[type=date],select{width:100%;font:1rem Georgia,serif;padding:.5rem;border:2px solid #b9b2a2;border-radius:6px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
.field{margin:.6rem 0}.field label,.qa>label{display:block;font-weight:bold;margin-bottom:.2rem}.qa{margin:1rem 0}
.check{display:flex;gap:.5rem;align-items:flex-start;margin:.35rem 0;font-weight:bold}.check input{width:1.3rem;height:1.3rem;margin-top:.2rem}
.donebox{margin-top:.6rem;padding:.6rem;background:#f1ede2;border-radius:6px}.donebox.ok{background:#e1efe6;color:#1d4a35}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.6rem;margin:.8rem 0}.facts dt{font:.75rem system-ui,sans-serif;text-transform:uppercase;color:#4a5562}.facts dd{margin:0;font-weight:bold}
.badge{display:inline-block;font:.78rem system-ui,sans-serif;border:1.5px solid var(--navy);border-radius:999px;padding:.1rem .6rem;margin:.1rem}
.s-completed,.s-mastery{background:#e1efe6;border-color:var(--green)}.s-needsreview{background:#f7e3e3;border-color:var(--warn)}.s-inprogress,.s-submitted{background:#fbf1d9;border-color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.7rem;margin-bottom:1rem}.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.7rem}.stat-v{font-size:1.5rem;font-weight:bold;color:var(--navy)}.stat-l{font:.8rem system-ui,sans-serif;color:#4a5562}
.progress{height:16px;background:#e7e2d4;border-radius:8px;overflow:hidden}.progress-in{height:100%;background:var(--green)}
.cal{display:grid;gap:.35rem}.calrow{display:grid;grid-template-columns:5.5rem repeat(5,1fr);gap:.35rem;align-items:stretch}.calcy{font:.8rem system-ui,sans-serif;align-self:center;color:#4a5562}
.cell{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--line);border-radius:8px;padding:.45rem .5rem;text-decoration:none;color:var(--ink);background:#fff;min-height:2.6rem}
.cell.cp{border-style:double;border-width:4px}.cell.today{outline:3px solid var(--gold)}.cell .cn{font-weight:bold}.cell .ci{font-size:1.1rem}
.cell.s-completed,.cell.s-mastery{background:#e1efe6;border-color:var(--green)}.cell.s-inprogress,.cell.s-submitted{background:#fbf1d9;border-color:var(--gold)}.cell.s-needsreview{background:#f7e3e3;border-color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:.5rem 1rem;font:.82rem system-ui,sans-serif;margin-top:.6rem}
.tablewrap{overflow-x:auto}.tbl{border-collapse:collapse;width:100%;font:.88rem system-ui,sans-serif}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:.4rem .5rem;text-align:left;vertical-align:top}.tbl th{background:#f1ede2}
.tbl input{width:5rem;padding:.2rem}
.chartwrap{margin:.5rem 0}.chart-svg,.chartwrap svg{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin-bottom:.4rem}.hint{font:.78rem system-ui,sans-serif;color:#4a5562}
.mcq{border:1px solid var(--line);border-radius:8px;margin:.7rem 0;padding:.5rem .8rem}.mcq legend{font-weight:bold;padding:0 .3rem}.opt{display:flex;gap:.5rem;padding:.3rem;border-radius:5px;cursor:pointer}.opt:hover{background:#f6f2e8}.opt input{margin-top:.35rem}
.review{border-left:5px solid var(--line);padding:.2rem .8rem;margin:.8rem 0}.review.right{border-color:var(--green)}.review.wrong{border-color:var(--warn)}.is-correct{font-weight:bold;color:var(--green)}.is-mine:not(.is-correct){text-decoration:underline;color:var(--warn)}
.compare .cols{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}.mine{background:#f6f2e8;padding:.5rem;border-radius:6px;white-space:pre-wrap}.sample{background:#e8f0ec;padding:.5rem;border-radius:6px}
@media(max-width:640px){.compare .cols{grid-template-columns:1fr}.calrow{grid-template-columns:1fr 1fr 1fr 1fr 1fr}.calcy{grid-column:1/-1}}
.rubric{margin:.9rem 0;padding-bottom:.6rem;border-bottom:1px solid var(--line)}
ul.plain{list-style:none;padding-left:.2rem}.pager{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.vocab{list-style:none;padding:0}.vocab li{padding:.5rem 0;border-bottom:1px solid var(--line)}
.flipcard{display:block;width:100%;min-height:11rem;font:1.4rem Georgia,serif;border:3px solid var(--navy);border-radius:14px;background:#fff;color:var(--navy);cursor:pointer;padding:1.2rem;text-align:center}.flipcard.back{background:var(--navy);color:#fff;font-size:1.1rem}
.result p{margin:.2rem 0}.inline{display:flex;flex-wrap:wrap;gap:.6rem}.inline input{width:7rem}
.msg{min-height:1.3rem;color:var(--warn);font-weight:bold}
.cert{border:10px double var(--navy);padding:.6rem;background:#fff;margin:1rem 0}.cert-in{border:2px solid var(--gold);padding:2rem 1.5rem;text-align:center}.cert h1{font-size:2rem}.cert-name{font-size:1.8rem;border-bottom:2px solid var(--navy);display:inline-block;padding:0 1.5rem;margin:.2rem 0 .8rem}.cert-top{letter-spacing:.1em;text-transform:uppercase;font:.8rem system-ui,sans-serif;color:var(--green)}.cert-fine{font-size:.78rem;color:#4a5562;margin-top:1.2rem}
/* print */
.printdoc{background:#fff;padding:1rem;font-size:11pt}.phead{border-bottom:2px solid #000;margin-bottom:.6rem}.pbrand{font:9pt system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em}.psub{margin:0 0 .4rem;font-size:10pt}
.ptbl{border-collapse:collapse;width:100%;font:9pt system-ui,sans-serif}.ptbl th,.ptbl td{border:1px solid #000;padding:3px 5px;vertical-align:top;text-align:left}.ptbl th{background:#e5e5e5}.cprow td{font-weight:bold;background:#f0f0f0}
.lines .ln{border-bottom:1px solid #777;height:1.55em}.pbox{display:inline-block;width:12px;height:12px;border:1.5px solid #000;vertical-align:-2px}
.plesson{page-break-before:always}.printdoc svg{max-width:100%;height:auto;border:1px solid #000}.pq{font-weight:bold;margin:.6rem 0 .1rem}.filled{white-space:pre-wrap;border-left:3px solid #000;padding-left:.5rem}
.pbsec,.pentry{break-inside:avoid;margin-bottom:.6rem}.pentry{border:1px solid #000;padding:.5rem;margin-bottom:1rem;page-break-after:always}.pfoot{margin-top:1.2rem;border-top:1px solid #000;font:8pt system-ui,sans-serif;padding-top:.3rem}.gloss{column-count:2;column-gap:1.5rem}.gloss div{break-inside:avoid;margin-bottom:.4rem}.gloss dt{font-weight:bold}.gloss dd{margin:0}.pimg{max-width:100%}
body.printmode{background:#fff}body.printmode #app{max-width:none;padding:0}
@media print{.noprint,#top,#foot{display:none!important}body{background:#fff}#app{max-width:none;padding:0}.printdoc{padding:0}@page{margin:14mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
h1[tabindex="-1"]:focus{outline:none}
@media(max-width:700px){#top{position:static}}
@media print{.pq{break-after:avoid}.plesson h3{break-after:avoid}}
.by{font:.75rem system-ui,sans-serif;color:#cfd8e3;margin-left:.3rem}
</style></head>

1: { title: "What Technical Analysis Is, and Is Not",
  obj: ["State the three premises behind chart-based analysis", "Contrast technical and fundamental approaches", "Explain why analysis and timing are different jobs"],
  explain: "Technical analysis studies market action (price, volume and, in futures, open interest) to judge what a market is likely to do next. It rests on three ideas: price already reflects what participants know, prices tend to move in trends, and human behavior repeats, so similar chart shapes recur. Fundamental analysis asks why a market should move; technical analysis asks what the market is actually doing. Many traders use fundamentals to pick a direction and charts to pick the moment. The same tools apply to stocks, futures, currencies and bonds, and to any time frame. None of this predicts the future with certainty; it organizes probabilities.",
  vocab: [["Technical analysis", "Studying price, volume and related market data, usually on charts, to judge likely future direction."], ["Market action", "The combined record of price, volume and open interest."], ["Discounting", "The idea that current prices already contain widely known information and expectations."], ["Timing", "Choosing when to enter or exit, separate from deciding which market or direction."], ["Trend", "The general direction in which a market's prices are moving."]],
  q: ["In your own words, what does it mean that market action 'discounts everything', and what is one limit of that idea?", "Why might a fundamentally sound view still lose money if timing is ignored?", "Describe one situation where a fundamental analyst and a chart reader could disagree, and how each might justify their view.", "Why does the idea that prices move in trends matter more to a trader than to a casual observer?", "Why can the same chart-reading principles be applied to different markets and time frames?"],

  disc: "A story you find convincing says a market must rise, but the chart is in a clear downtrend. What do you do, and what does patience look like here?" },
2: { title: "Using the Tool Honestly: Criticisms and Random Walk",
  obj: ["Compare technical analysis in stocks and futures", "Summarize the main criticisms of the technical approach", "Explain the random walk argument and a fair response to it"],
  explain: "Chart reading is not a crystal ball, and honest practitioners know its critics. Common objections: patterns are subjective, so two analysts may read one chart differently; predictions can become self-fulfilling and then stop working; and the random walk argument says past prices carry no usable information. Supporters answer that markets are made of people, that trends and patterns appear across eras, and that a disciplined process with defined risk can show an edge even if no single signal is reliable. The practical lesson for a student is humility: define rules, expect failures, and size trades so a wrong read is survivable. Stocks and futures differ in leverage, expiry and the data available, so tools get adapted.",
  vocab: [["Technician", "A person who analyzes markets mainly with price and volume data."], ["Chartist", "A technician who focuses mainly on reading chart patterns."], ["Random walk theory", "The view that price changes are unpredictable, so past data cannot improve forecasts."], ["Self-fulfilling", "A signal that works partly because many traders act on it at once."], ["Subjectivity", "Different observers reaching different readings from the same chart."]],
  q: ["State the random walk argument fairly, in two sentences, as a skeptic would.", "Give one reply a technician could make to that argument.", "Why does subjectivity in chart reading make written rules valuable?", "How could a self-fulfilling signal stop working, and what should a trader do about it?", "What changes when applying chart analysis to stocks versus futures (think leverage and expiry)?"],
  chart: [{ k: "up", cap: "Simulated bars. Two analysts annotate it.", q: "Draw a trendline you think is reasonable. Then explain how a second analyst might draw a different one and what that implies." }, { k: "fbrk", cap: "Simulated bars with a failed signal.", q: "Identify the point where a signal looked valid but failed. How would a written exit rule have limited the damage?" }],
  disc: "You have had three losing trades in a row from valid-looking setups. A skeptic says 'it's all random'. How do you respond to the doubt without abandoning your process or increasing size?" },
3: { title: "Dow Theory: The Foundation of Trend Thinking",
  obj: ["List the basic tenets of Dow Theory in your own words", "Explain confirmation and why closing prices matter", "Describe the main criticisms and the futures application"],
  explain: "Dow Theory is the oldest framework for reading markets and underlies much of modern chart work. Its core ideas: averages discount everything; markets have three trends (primary, secondary, minor), much like tide, wave and ripple; primary trends have phases; two averages should confirm each other; volume should confirm trend; and a trend is assumed to continue until clear reversal signals appear. Closing prices carry special weight because they show where the market settled after the day's debate. Critics say the theory is late, vague about what counts as confirmation, and slow to signal. A thoughtful student treats it as a way to keep the big picture in view, not as a trade trigger.",
  vocab: [["Primary trend", "The major, long-lasting direction of a market, lasting from months to years."], ["Secondary trend", "A corrective counter-move within a primary trend."], ["Minor trend", "Short-term fluctuations, often just noise inside a secondary move."], ["Confirmation", "When related indicators or averages agree with each other, strengthening a signal."], ["Closing price", "The final price of a session, treated as the most important of the day."]],
  q: ["Explain the three trends of Dow Theory with an analogy of your own.", "Why does Dow Theory ask two averages to confirm each other?", "Why are closing prices considered more meaningful than intraday highs?", "Name two criticisms of Dow Theory and say whether each is fair.", "How could you use Dow Theory ideas without trading its signals directly?"],
  chart: [{ k: "pull", cap: "Simulated bars: primary uptrend with a secondary pullback.", q: "Label the primary trend and the secondary correction. At what point would you consider the primary trend damaged?" }, { k: "up", cap: "Simulated bars with volume.", q: "Does volume appear to confirm the move? Describe what you see and what you would want to see." }],
  disc: "A secondary pullback feels like a reversal and you want to exit a good position. What evidence would you require before acting, and what is the cost of reacting to noise?" },
4: { title: "How Charts Are Built",
  obj: ["Name the main chart types and when each is useful", "Contrast arithmetic and logarithmic scales", "Describe how bars, volume and open interest are plotted"],
  explain: "A chart is a record, and the way it is drawn changes what you notice. A daily bar chart shows open, high, low and close for each session; volume is plotted beneath; and futures charts add open interest. Line charts show closes only, candlesticks add color to the open-close relationship, and point-and-figure charts ignore time entirely. Scale matters: an arithmetic scale spaces equal price changes equally, while a logarithmic scale spaces equal percentage changes equally, which is usually fairer for large moves. Choose chart type and scale deliberately, then stay consistent so your pattern recognition has something stable to learn from.",
  vocab: [["Bar chart", "A chart where each period is a vertical bar showing high, low, open (left tick) and close (right tick)."], ["Candlestick chart", "A chart where each period's open-to-close range is a colored body with wicks showing the extremes."], ["Arithmetic scale", "A vertical axis where equal price distances look equal."], ["Logarithmic scale", "A vertical axis where equal percentage changes look equal."], ["Open interest", "In futures, the number of outstanding contracts not yet closed out."]],
  q: ["What four prices does one daily bar record, and what do the ticks mean?", "When would a logarithmic scale change your reading of a long-term chart?", "What extra information do candlesticks display compared with line charts?", "What is open interest and why does it not exist for ordinary stocks?", "Why is it a good idea to stick with one chart set-up while learning?"],
  chart: [{ k: "up", cap: "Simulated bars, arithmetic view.", fmt: "bar", q: "Describe, using highs and lows only, how many higher highs and higher lows you can count." }, { k: "up", cap: "Same series as candlesticks.", fmt: "candle", q: "Compare it with a bar view. Which view makes the open-to-close relationship easier to see?" }],

6: { title: "Defining Trend: Direction and Classification",
  obj: ["Define an uptrend and a downtrend by their swing points", "Name the three trend directions and three classifications", "Explain why weekly and monthly charts add perspective"],
  explain: "A trend is a sequence of swing points. In an uptrend each rally peak and each pullback trough is higher than the one before; in a downtrend each is lower; in a sideways trend neither pattern holds. Trends are also classified by length: major, intermediate and minor, which echoes the three trends of Dow Theory. A trend is considered intact until the pattern of swings breaks. Weekly and monthly bar charts compress many days into one bar, which filters noise and shows which direction the larger trend favors. Always identify the larger trend first; trading against it asks for stronger evidence and tighter risk.",
  vocab: [["Peak", "A swing high: a price high followed by a decline."], ["Trough", "A swing low: a price low followed by a rally."], ["Uptrend", "A series of rising peaks and rising troughs."], ["Downtrend", "A series of falling peaks and falling troughs."], ["Sideways trend", "A range in which peaks and troughs stay at roughly the same levels."]],
  q: ["Define an uptrend using peaks and troughs. What single event would be the first warning that it may be weakening?", "Why can a market be in an uptrend on a weekly chart and a downtrend on a 5-minute chart at the same time?", "Explain the three trend directions and why a sideways trend is often the hardest to trade.", "What is the difference between a major and an intermediate trend, and why does it matter for planning a trade?", "Give two reasons a weekly or monthly chart should be consulted before a daily entry."],
  chart: [{ k: "up", cap: "Simulated daily bars.", q: "Mark at least three peaks and three troughs. State whether the swings confirm an uptrend and where the pattern would break." }, { k: "range", cap: "Simulated daily bars.", q: "What type of trend is this? Name the upper and lower boundaries and say what you would wait for before trading." }],
  disc: "You see a strong daily downtrend but the weekly chart is in an uptrend. List the risks of shorting here and what rule would keep you from forcing a trade." },
7: { title: "Support and Resistance",
  obj: ["Define support and resistance and how they form", "Explain the role reversal when levels break", "Describe how volume and time affect a level's significance"],
  explain: "Support is a price area where buying has repeatedly been strong enough to stop a decline; resistance is where selling has stopped a rise. These areas exist because of memory: traders who bought at a level and watched it fall want to get out at breakeven when price returns, and traders who missed an entry want to buy near an earlier low. When a level breaks decisively, it often changes roles, so broken support tends to act as new resistance and vice versa. A level matters more when it was tested often, had heavy volume, is recent, and is far behind the current price. Treat levels as zones, not exact lines.",
  vocab: [["Support", "A price zone where buying interest tends to stop declines."], ["Resistance", "A price zone where selling interest tends to stop rallies."], ["Role reversal", "Broken support becoming resistance, or broken resistance becoming support."], ["Breakout", "A move beyond a support or resistance zone."], ["Zone", "A band of prices rather than a single exact value."]],
  q: ["Explain why traders' memories create support and resistance.", "What does it mean when broken resistance turns into support? Describe a simple sequence of events.", "List three features that make a level more significant.", "Why should levels be drawn as zones, and what mistake does a single exact line invite?", "What distinguishes a meaningful breakout from a brief poke through a level?"],
  chart: [{ k: "sr", cap: "Simulated bars: support breaks then acts as resistance.", q: "Draw the support zone and show where it became resistance. Describe what the retest tells you." }, { k: "fbrk", cap: "Simulated bars: breakout that fails.", q: "Mark the level that failed. What evidence on the chart suggests the breakout was weak, and where would a trade be invalidated?" }],
  disc: "Price pokes through resistance by a few cents and then falls back. You had already bought on the breakout. What does your plan say, and how do you avoid moving your stop to 'give it room'?" },
8: { title: "Trendlines and the Fan Principle",
  obj: ["Draw valid up and down trendlines", "Judge trendline significance and what a break means", "Explain the fan principle"],
  explain: "A trendline connects successive troughs in an uptrend (or peaks in a downtrend) and extends forward to show where the trend should hold. Two points define a line, but a third touch confirms it. A line is more reliable when it has more touches, spans more time and is not too steep. When price closes decisively through the line, the trend is flagged as at risk, though a break is a warning rather than a verdict, so look for confirmation. The fan principle describes what happens when a steep line breaks and a flatter one replaces it: after three successive breaks, the trend is generally considered to have turned.",
  vocab: [["Trendline", "A straight line connecting a series of peaks or troughs to show trend direction."], ["Trendline break", "A decisive move through a trendline suggesting the trend may be changing."], ["Fan principle", "Redrawing trendlines at flatter angles after each break until three are broken."], ["Touch", "A time price reaches a line and reverses, adding evidence of its validity."], ["Return move", "A pullback to a broken line before the move continues."]],
  q: ["What is the minimum needed to draw a trendline, and what makes it valid?", "Which features make a trendline more significant: number of touches, length, steepness? Explain each.", "Why is a trendline break a warning rather than a certainty?", "Describe the fan principle step by step.", "What is a return move and how can it help a cautious trader?"],
  chart: [{ k: "up", cap: "Simulated bars.", q: "Draw an up trendline using the troughs. How many touches does it have and what would a break of it signal?" }, { k: "pull", cap: "Simulated bars with a retracement.", q: "Draw the trendline and a second flatter line after the first breaks. State what a third break would imply." }],
  disc: "A trendline breaks and you exit early, then price resumes up. You feel you 'should have waited'. How do you assess whether the exit was a good decision independent of the outcome?" },
9: { title: "Channels, Steepness and Retracements",
  obj: ["Draw a channel line and use it for expectations", "Explain how steepness affects sustainability", "Apply percentage retracements to a pullback"],
  explain: "Drawing a line parallel to the trendline, on the opposite side of price, creates a channel. If price reaches the far side of the channel, the move is healthy, and failure to reach it can be an early sign of weakness. A very steep trendline signals an unsustainable pace that often breaks and gets replaced by a flatter one. Percentage retracements estimate how much of the prior move a counter-move typically gives back: commonly about a third to two-thirds, with half as a frequent benchmark and a full give-back meaning the trend is in trouble. These are tendencies, not rules, and work best when they line up with other evidence such as support levels.",
  vocab: [["Channel", "A pair of parallel lines containing price action in a trend."], ["Channel line", "The parallel line drawn opposite the trendline, marking a likely target zone."], ["Retracement", "A partial counter-move against the preceding trend."], ["Percentage retracement", "The share of the prior move that a correction gives back."], ["Steep trendline", "A line at a sharp angle, indicating an unsustainable pace."]],
  q: ["How do you construct a channel and what does it tell you about trend health?", "What does it mean when price fails to reach the channel line in an uptrend?", "Why do very steep trendlines tend to break and what usually follows?", "Describe the typical retracement zones and how they could help you plan a pullback entry.", "Why should retracement levels be combined with other evidence?"],
  chart: [{ k: "chan", cap: "Simulated bars in a rising channel.", q: "Draw both channel lines. Which touches look healthy and which, if any, show weakness?" }, { k: "pull", cap: "Simulated bars: trend and pullback.", q: "Measure the pullback as a percentage of the prior rally. Does it land near a support level? What would invalidate a buy idea?" }],
  disc: "You want to buy a 50% pullback but it keeps falling toward 62%. Describe how you decide in advance when your idea is wrong and how you avoid averaging down." }
});

11: { title: "Speed Lines, Reversal Days and Gaps",
  obj: ["Describe speed resistance lines and fan lines", "Recognize key reversal days and what they do and do not prove", "Classify price gaps by type"],
  explain: "Several tools refine how a trend is measured. Speed resistance lines divide a move into thirds to show where a pullback might stall; Gann and Fibonacci fan lines use set angles or ratios for similar purposes. Internal trendlines ignore extreme spikes to fit the bulk of the price action. A reversal day occurs when price makes a new extreme and then closes in the opposite direction, ideally on high volume; it signals exhaustion but only matters in context. Gaps appear when one session's range does not overlap the previous one. Common gap, breakaway gap, runaway gap and exhaustion gap each carry different meanings, and a gap that fills quickly is generally less meaningful than one that holds.",
  vocab: [["Speed resistance line", "A line dividing a prior move into thirds to estimate where a correction may find support."], ["Reversal day", "A session making a new extreme then closing against the prior direction."], ["Gap", "A price area where no trading occurred between two sessions."], ["Breakaway gap", "A gap leaving a pattern and starting a new move."], ["Exhaustion gap", "A late-trend gap that signals the move may be running out of steam."]],
  q: ["How do speed resistance lines help set expectations for a correction?", "What conditions make a reversal day more meaningful?", "Why can a single reversal day be misleading by itself?", "Compare breakaway, runaway and exhaustion gaps.", "Why does a gap that fills quickly weaken the message?"],
  chart: [{ k: "revday", cap: "Simulated bars with a reversal day.", q: "Identify the reversal day. What confirmation would you require before acting?" }, { k: "gap", cap: "Simulated bars with gaps.", q: "Locate each gap and classify it by position in the trend. Which one deserves the most caution?" }],
  disc: "A big gap opens in your favor and you want to add to the position. How do you decide size and stop so a gap fill does not become an outsized loss?" },
12: { title: "Head and Shoulders Reversal Patterns",
  obj: ["Identify the parts of a head and shoulders top", "Explain neckline, volume and measuring techniques", "Distinguish confirmed from unconfirmed patterns"],
  explain: "The head and shoulders top is among the best-known reversal patterns. It forms after an uptrend: a left shoulder peak, a higher head, then a lower right shoulder, with a neckline connecting the troughs. The pattern is not complete until price closes decisively below the neckline, because up to that moment it could be just another consolidation. Volume often shrinks on the right shoulder, and expands on the break. A common way to estimate a minimum target is to measure the head-to-neckline distance and project it down from the breakout. Pullbacks to the neckline after the break are common, and the pattern fails if price returns well above the neckline.",
  vocab: [["Head and shoulders top", "A three-peak reversal pattern with a higher middle peak, signaling a possible trend change."], ["Neckline", "The line connecting the troughs between the peaks; its break confirms the pattern."], ["Price objective", "A projected minimum target based on the pattern's height."], ["Confirmation", "A decisive close beyond the neckline, validating the pattern."], ["Return move", "A pullback to the broken neckline before the trend resumes."]],
  q: ["Name the parts of a head and shoulders top and what each suggests about buyers and sellers.", "Why is the pattern not complete until the neckline breaks?", "What role does volume play, and what would be a warning sign?", "Explain the measuring technique for a price objective.", "What would make you abandon a short idea after the neckline break?"],
  chart: [{ k: "hs", cap: "Simulated bars forming a head and shoulders.", vol: true, q: "Mark both shoulders, the head and the neckline. Calculate the measured move from the break." }, { k: "hs", cap: "Same pattern earlier in formation.", trim: 0.78, vol: true, q: "At this stage, what would you say to a friend who wants to short immediately? What evidence is missing?" }],
  disc: "You short the neckline break, price returns to the neckline and then falls. You almost covered in the pullback. How do you plan for a return move in advance?" },
13: { title: "Inverse, Complex, Triple and Double Patterns",
  obj: ["Recognize the inverse head and shoulders and its volume pattern", "Describe complex, triple and double tops and bottoms", "Judge the importance of the time and size of a base"],
  explain: "Bottoms mirror tops, but there is one key difference: volume should be stronger on the breakout above the neckline in an inverse head and shoulders. Complex versions contain multiple shoulders and are read the same way. Triple tops and bottoms are three tests of the same level; the pattern is confirmed only when price breaks the intervening trough or peak. Double tops, often called the 'M' pattern, and double bottoms, the 'W', are more common and more frequently misread, since two peaks alone do not complete a reversal; the break of the middle low does. Wider, longer patterns generally lead to bigger moves, and the measuring rule projects the pattern's height from the breakout point.",
  vocab: [["Inverse head and shoulders", "A bottoming pattern with a lower middle trough, the mirror of the top."], ["Complex head and shoulders", "A pattern with more than one shoulder or head."], ["Double top", "Two similar peaks with a trough between; confirmed on a break below that trough."], ["Triple bottom", "Three similar lows; confirmed on a break above the highest rally between them."], ["Base", "A period of sideways trading after a decline, from which a new advance may start."]],
  q: ["How does volume behavior differ between a top and a bottom?", "Why is a double top not confirmed by the second peak alone?", "Describe the confirmation points for a triple bottom.", "Why do longer, wider patterns tend to imply larger moves?", "What would make you doubt a bottom even after a breakout?"],
  chart: [{ k: "ihs", cap: "Simulated bars forming an inverse head and shoulders.", vol: true, q: "Mark the neckline. What does the volume do on the breakout and why does it matter?" }, { k: "dtop", cap: "Simulated bars forming a double top.", q: "Where is the confirmation level and what would the measured objective be?" }],
  disc: "A double top looks obvious but price has not broken the middle low yet. You feel anxious about missing the move. What rule protects you from acting before confirmation?" },
14: { title: "Pattern Variations, Saucers, Spikes and Triangles",
  obj: ["Accept that real patterns vary from the ideal", "Recognize saucers and V-shaped spikes", "Introduce continuation patterns and triangles"],
  explain: "Real charts rarely match the textbook picture. Necklines may slope, shoulders may differ in size, and volume may not behave as described. The key is to ask whether the structure still shows a shift in control. Rounding tops and bottoms (saucers) form slowly, with volume fading toward the turn and building after; spikes (V tops and bottoms) reverse abruptly and are hard to trade because they offer little warning. Chapter 6 then shifts to continuation patterns, which suggest a pause before the prior trend resumes. Triangles are the first family: they show converging highs and lows and tend to resolve by a breakout in one direction, often with the breakout leg following the earlier trend.",
  vocab: [["Saucer", "A slow, rounded turn in price, often with a matching rounded volume pattern."], ["Spike (V reversal)", "An abrupt reversal with little prior warning."], ["Continuation pattern", "A pause in a trend after which the trend is expected to resume."], ["Triangle", "A pattern of converging trendlines showing consolidation."], ["Variation", "A real-world deviation from the ideal pattern shape."]],
  q: ["Why does imperfection in a pattern not automatically invalidate it?", "What makes spikes difficult to trade compared with saucers?", "How do reversal and continuation patterns differ in what they imply?", "What does a triangle show about the balance of buyers and sellers?", "Why is waiting for a breakout important for triangles?"],
  chart: [{ k: "sauc", cap: "Simulated bars forming a saucer.", vol: true, q: "Describe the pace of change and what the volume suggests about participants. How would you plan an entry?" }, { k: "spike", cap: "Simulated bars with a V reversal.", q: "What made this reversal hard to anticipate and what risk control would you use in such markets?" }],
  disc: "A pattern is close but not textbook. Describe a rule for deciding whether an imperfect pattern is tradable and how you avoid 'seeing' patterns you want to see." }
});

16: { title: "Triangles, Broadening Formations and Flags",
  obj: ["Distinguish symmetrical, ascending and descending triangles", "Explain breakout behavior, volume and the timing guideline", "Describe flags and pennants"],
  explain: "Triangles show price range narrowing as highs and lows converge. A symmetrical triangle has a falling upper line and rising lower line and is neutral until it breaks. An ascending triangle has a flat top and rising lows, which usually favors an upward break because buyers keep paying more; the descending triangle is its bearish mirror. A breakout is expected before price reaches the apex, and a break very near the apex is less reliable. Broadening formations widen instead of narrowing and signal unstable, emotional trading. Flags and pennants are short, steep consolidations after a sharp move; they often appear halfway through a trend and resolve in the trend's direction.",
  vocab: [["Symmetrical triangle", "A triangle with a falling upper and rising lower trendline, directionally neutral until a break."], ["Ascending triangle", "A triangle with a flat top and rising lows, usually bullish."], ["Descending triangle", "A triangle with a flat bottom and falling highs, usually bearish."], ["Apex", "The point where the triangle's two lines meet."], ["Flag/pennant", "A brief, tight pause after a sharp move that usually resolves in the same direction."]],
  q: ["What does a narrowing price range say about the balance of buyers and sellers?", "Why does an ascending triangle usually favor an upward breakout?", "What does a breakout very near the apex tell you about reliability?", "How do broadening formations differ in character from triangles?", "Describe how a flag differs from a reversal pattern in size, steepness and implication."],
  chart: [{ k: "sym", cap: "Simulated bars forming a symmetrical triangle.", vol: true, q: "Draw both lines. Where would a breakout be reliable and what would you do if the break comes right at the apex?" }, { k: "flag", cap: "Simulated bars with a sharp move and a flag.", q: "Mark the flagpole and flag. Estimate a measured objective and a stop." }],
  disc: "A triangle breaks upward but reverses within two bars. You were long. What was the plan for this possibility and how did the plan limit emotional reaction?" },
17: { title: "Wedges, Rectangles, Measured Moves and Divergence",
  obj: ["Identify wedges and rectangles and their usual resolution", "Apply the measured-move idea", "Explain confirmation and divergence"],
  explain: "A wedge has two converging lines that both slope the same way; a rising wedge in an uptrend is usually bearish, and a falling wedge in a downtrend is usually bullish. A rectangle is a horizontal range between support and resistance; in a trend it tends to resolve with the trend, but a break either way settles it. The measured move suggests that after a pause, a second leg may roughly equal the first. A continuation head and shoulders can appear inside a trend as a pause. Confirmation means related indicators or markets agree with the signal; divergence is when they disagree, a warning to be more careful rather than an automatic reversal signal.",
  vocab: [["Wedge", "Converging lines that both slope in the same direction, often marking an exhausted move."], ["Rectangle", "A horizontal consolidation between parallel support and resistance."], ["Measured move", "An estimate that a second leg will be similar in size to the first."], ["Divergence", "When price makes a new extreme but an indicator or related market does not."], ["Confirmation", "When separate measures agree with a price signal."]],
  q: ["Why is a rising wedge in an uptrend viewed as a warning?", "How would you decide whether a rectangle is a pause or a topping area?", "What are the limits of the measured-move idea?", "Explain the difference between confirmation and divergence with an example.", "Why is divergence a caution instead of an automatic exit signal?"],
  chart: [{ k: "wedge", cap: "Simulated bars forming a rising wedge.", q: "Draw both lines and state what you would wait for before acting." }, { k: "rect", cap: "Simulated bars with a rectangle in an uptrend.", q: "Mark support and resistance. Where is a stop for a breakout trade and how far is a measured objective?" }],
  disc: "Divergence shows up on your indicator while price still trends strongly. How do you handle the urge to call a top, and what small action would be consistent with caution?" },
18: { title: "Volume and Open Interest as Secondary Indicators",
  obj: ["Explain why volume and open interest are secondary to price", "Apply basic volume interpretation rules", "Describe what volume says about trend health"],
  explain: "Price is the primary evidence; volume and open interest are secondary, helping judge how much conviction stands behind a move. The general rule: volume should expand in the direction of the trend, so rising prices on rising volume and pullbacks on falling volume are healthy. When rallies occur on shrinking volume while declines occur on heavy volume, the trend may be losing support. Volume confirms breakouts, and a breakout on weak volume is suspect. Volume can also reveal exhaustion: a very high-volume final push may mark a climax. Always compare volume to its recent average, not to a fixed number.",
  vocab: [["Volume", "The number of shares or contracts traded in a period."], ["Secondary indicator", "Information that supports but does not replace price analysis."], ["Volume confirmation", "Volume expanding in the direction of the trend or a breakout."], ["Climax", "A surge in volume and price movement that exhausts a trend."], ["On-balance volume (OBV)", "A running total that adds volume on up days and subtracts it on down days."]],
  q: ["Why is volume considered secondary to price?", "State the basic volume rule for a healthy uptrend and downtrend.", "What does a breakout on weak volume suggest and how would you adjust risk?", "How might volume reveal an exhausted trend?", "Why is relative volume (versus recent average) more useful than raw volume?"],
  chart: [{ k: "brk", cap: "Simulated bars: range followed by breakout on high volume.", vol: true, q: "Compare volume before and during the breakout. What does it add to your confidence?" }, { k: "blow", cap: "Simulated bars with a volume climax.", vol: true, q: "Describe how the final push looks different from earlier rallies and what you would do with a long position." }],
  disc: "Volume is thin during a breakout you really want to take. Write one rule that adjusts position size or entry in such cases." },
19: { title: "Open Interest, Commitments of Traders and Option Sentiment",
  obj: ["Interpret open interest changes alongside price in futures", "Explain the Commitments of Traders report at a high level", "Describe put/call ratios as sentiment gauges"],
  explain: "In futures, open interest shows how many contracts are outstanding. Rising price with rising open interest suggests new money supporting the trend, while rising price with falling open interest points to short covering and a weaker advance. Falling price with rising open interest shows new shorts; a decline with falling open interest suggests liquidation. The Commitments of Traders report breaks open interest into groups such as commercial hedgers and large speculators; some analysts watch for extremes that coincide with turning points. Option data offer another view: put/call ratios measure the relative activity in puts and calls and are often read as contrarian sentiment gauges at extremes. None of these is a standalone trigger.",
  vocab: [["Open interest", "The total number of futures or options contracts not yet closed or settled."], ["Short covering", "Buying back short positions, which can lift price without new buyers."], ["Commitments of Traders (COT)", "A regular report showing futures positions by trader category."], ["Commercial", "A hedger who uses futures to offset business risk."], ["Put/call ratio", "Put volume or open interest divided by call volume or open interest, used as a sentiment measure."]],
  q: ["What does rising price with falling open interest suggest and why?", "Describe the four combinations of price and open interest direction.", "Why do some analysts pay attention to commercial hedgers' positions?", "How can a put/call ratio extreme be read as contrarian?", "Why should sentiment data be combined with price evidence?"],
  chart: [{ k: "up", cap: "Simulated uptrend; imagine open interest rising throughout.", q: "How would rising open interest change your confidence compared with falling open interest?" }, { k: "chop", cap: "Simulated choppy market.", q: "Suppose put/call ratios are at an extreme. What would you still need to see on the chart before acting?" }],
  disc: "A sentiment extreme suggests a turn, yet your chart rules do not signal. What do you do and why is discipline about 'not acting' a skill?" }
});

21: { title: "Long Term Charts and the Bigger Picture",
  obj: ["Explain why a longer-range perspective matters", "Describe continuation charts for futures and perpetual contracts", "State what long-term charts are and are not used for"],
  explain: "Before looking at a daily chart, step back. Weekly, monthly and even multi-year charts show the major trend, long-term support and resistance, and how large the current move is in context. Futures contracts expire, so continuous or perpetual series are constructed by linking contracts, and the method used affects what you see, especially the price gaps between contracts. Charts adjusted for inflation can show whether a move is real or partly a change in the currency's value. Long-term charts are mostly for context and risk framing, not for timing precise entries, which still belong on shorter charts. Always know which scale and method you are using.",
  vocab: [["Long-term chart", "A weekly, monthly or longer chart used for context."], ["Continuation (continuous) chart", "A futures chart that links expiring contracts into one series."], ["Perpetual contract", "A constructed series that tries to represent a constant-maturity contract."], ["Inflation adjustment", "Restating prices to remove changes in the value of money."], ["Context", "The larger setting in which a short-term signal appears."]],
  q: ["Why should a long-term chart be reviewed before a short-term entry?", "What problem do continuation charts for futures solve and what trade-off do they introduce?", "Why might an inflation-adjusted chart change your view of a long-term high?", "Why are long-term charts not intended for precise trading entries?", "Give one example of how long-term context could change your stop distance or size."],
  chart: [{ k: "up", cap: "Simulated long-term (weekly) series.", q: "Describe the major trend and identify the nearest major support. How would that frame a daily trade?" }, { k: "range", cap: "Simulated long-term series.", q: "A daily chart shows a breakout above 110 on this long-term range. What does the bigger picture suggest about the quality of that breakout?" }],
  disc: "You love a daily setup that runs straight into long-term resistance. Describe how you decide to take, skip or reduce the trade." },
22: { title: "Moving Averages: Smoothing with a Time Lag",
  obj: ["Define simple, weighted and exponential moving averages", "Explain lag and crossover signals", "Judge the trade-off between speed and false signals"],
  explain: "A moving average smooths price by averaging the last N periods, so the line drifts behind price: that lag is the cost of smoothness. A simple moving average weights all periods equally; weighted and exponential versions emphasize recent prices and react faster. Common uses are trend direction (price above a rising average is bullish), crossovers (a shorter average crossing a longer one) and dynamic support or resistance. Shorter averages react quickly but whipsaw more; longer ones are steadier but later. In sideways markets moving averages tend to generate many false signals, so they work best in trending markets. They describe the trend; they do not predict it.",
  vocab: [["Simple moving average (SMA)", "The average closing price over the last N periods, each weighted equally."], ["Exponential moving average (EMA)", "A moving average that gives more weight to recent prices."], ["Lag", "The delay between a price move and the moving average reflecting it."], ["Crossover", "When one moving average crosses another or price crosses an average."], ["Whipsaw", "A false signal that reverses quickly, common in sideways markets."]],
  q: ["Why does every moving average lag price, and what is the benefit of that lag?", "Compare simple and exponential averages in speed and noise.", "How is a crossover signal formed and why does it work poorly in sideways markets?", "How can a moving average act as dynamic support or resistance?", "What would you consider when choosing a moving average length?"],
  chart: [{ k: "up", cap: "Simulated uptrend with 20- and 50-bar moving averages.", ma: [20, 50], q: "Describe how price behaves relative to each average and where the faster average acts as support." }, { k: "chop", cap: "Simulated choppy market with 20 and 50 moving averages.", ma: [20, 50], q: "Count the crossovers. What does that tell you about using moving averages in this market?" }],
  disc: "After two whipsaw losses you want to switch average lengths. What objective check would you do before changing a rule?" },
23: { title: "Envelopes, Bollinger Bands and the Weekly Rule",
  obj: ["Explain moving average envelopes and Bollinger Bands", "Interpret band width as a volatility gauge", "Describe Fibonacci averages, long-term averages and the weekly rule"],
  explain: "An envelope is a fixed percentage band above and below a moving average. Bollinger Bands instead set the bands at a number of standard deviations, so they widen when volatility rises and narrow when it falls. A narrowing of the bands signals a quiet period that often precedes a larger move, though not its direction. Price touching a band is not an automatic reversal signal; in strong trends it can ride a band for long. Band width gives a measure of volatility, and bands can sometimes mark likely targets. Moving averages are also tied to cycles and Fibonacci numbers by some practitioners, and long-term averages (such as a 200-day) are widely watched. The weekly rule is a breakout approach based on N-week highs and lows.",
  vocab: [["Envelope", "A fixed-percentage band around a moving average."], ["Bollinger Bands", "Bands set at standard deviations around a moving average, adapting to volatility."], ["Band width", "The distance between upper and lower bands, a measure of volatility."], ["Squeeze", "A period of narrow band width, often followed by increased volatility."], ["Weekly rule", "A breakout method that signals when price exceeds the high or low of the last N weeks."]],
  q: ["How do Bollinger Bands differ from fixed-percentage envelopes?", "What does a narrowing of the bands imply and what does it not imply?", "Why is touching the upper band not by itself a sell signal?", "What does band width measure and how might a trader use it?", "Describe the idea behind the weekly rule breakout."],
  chart: [{ k: "brk", cap: "Simulated bars with Bollinger Bands.", bb: true, q: "Where do the bands narrow and what follows? Does price walk the band after the breakout?" }, { k: "up", cap: "Simulated trend with Bollinger Bands.", bb: true, q: "Describe how price interacts with the bands in a strong trend and what that means for a 'sell at the upper band' rule." }],
  disc: "A band squeeze excites you and you jump in before direction is clear. What would a disciplined approach require before entering?" },
24: { title: "Optimization, Adaptive Averages and Momentum Basics",
  obj: ["Discuss the dangers of optimizing indicator settings", "Describe adaptive averages and alternatives", "Begin oscillators: usage with trend and measuring momentum"],
  explain: "Optimization means searching for the indicator settings that would have worked best in the past. The danger is overfitting: settings tuned to old data often fail on new data. Many practitioners prefer widely used, simple settings and test across markets and periods. Adaptive moving averages change speed with market conditions, reacting faster in clean trends and slower in noise. Chapter 10 begins with oscillators, tools that fluctuate within a range to show momentum and overbought or oversold conditions. They are most helpful in sideways markets, and in strong trends they can stay at an extreme for a long time. Momentum measures speed of price change, and its direction can warn before price does.",
  vocab: [["Optimization", "Choosing indicator settings by testing which would have performed best on past data."], ["Overfitting", "Tuning a method so closely to past data that it fails on new data."], ["Adaptive moving average", "An average that changes its responsiveness with market conditions."], ["Oscillator", "An indicator that moves within a band or around a center line to show momentum."], ["Momentum", "The speed or rate of price change."]],
  q: ["What is overfitting and why does optimization risk it?", "What advantage might an adaptive average offer compared with a fixed one?", "Why do oscillators work better in sideways markets?", "What does it mean when momentum slows while price still rises?", "How would you test whether a setting works beyond one market and period?"],
  chart: [{ k: "up", cap: "Simulated uptrend with an oscillator pane.", osc: true, q: "Does the oscillator stay in the upper zone? What does that say about 'overbought' in a trend?" }, { k: "wedge", cap: "Simulated rising wedge with an oscillator pane.", osc: true, q: "Compare the oscillator peaks with the price peaks and describe what you see." }],
  disc: "You find a setting that backtests perfectly. List three checks you would require before trusting it with real money." }
});

26: { title: "Rate of Change, CCI and the Relative Strength Index",
  obj: ["Calculate and interpret rate of change", "Explain oscillators built from two moving averages", "Describe CCI and RSI and their overbought/oversold zones"],
  explain: "Rate of change compares today's price with the price N periods ago; above zero means the market is higher than it was, and the slope shows whether the pace is increasing. An oscillator can also be made by subtracting a longer moving average from a shorter one. The Commodity Channel Index measures how far price is from its own average relative to typical deviation, and the Relative Strength Index scales recent gains against recent losses on a 0 to 100 range. Traditional readings treat RSI above 70 as overbought and below 30 as oversold, but in strong trends it can stay in those zones. Divergences between RSI and price, and failure swings, are more informative than a simple touch of a zone.",
  vocab: [["Rate of change (ROC)", "Today's price compared with the price N periods ago."], ["Overbought", "A condition where an oscillator suggests price has risen too far, too fast."], ["Oversold", "A condition where an oscillator suggests price has fallen too far, too fast."], ["RSI", "Relative Strength Index, a bounded momentum oscillator from 0 to 100."], ["Failure swing", "An RSI pattern where it fails to exceed a prior peak or trough, then breaks a key level."]],
  q: ["How does ROC measure momentum, and what does it mean when ROC rolls over while price is still rising?", "Why can an oscillator built from two moving averages be useful?", "What does RSI measure and why is it bounded between 0 and 100?", "Why is 'RSI over 70 means sell' unreliable in a strong uptrend?", "What is a divergence between RSI and price and what does it suggest?"],
  chart: [{ k: "up", cap: "Simulated uptrend with an RSI pane.", osc: true, q: "How long does RSI stay above 70? What does that tell you about using it as a sell signal?" }, { k: "wedge", cap: "Simulated rising wedge with RSI.", osc: true, q: "Mark any divergence and describe what you would wait for before acting." }],
  disc: "RSI is oversold and you want to buy a falling market because it 'must bounce'. How do you decide, and what does it cost if you are wrong?" },
27: { title: "Stochastics, Williams %R and When Oscillators Work",
  obj: ["Explain stochastics and Williams %R", "State when oscillators are most useful", "Introduce MACD"],
  explain: "Stochastics compares the latest close with the recent high-low range; in uptrends closes tend to cluster near the top of the range, and the %K and %D lines show whether that is persisting. Readings above 80 or below 20 are the traditional zones, and crossovers of the two lines provide timing cues. Williams %R is a similar measure on an inverted scale. The important rule is trend first: oscillators give the best signals in trading ranges, and in strong trends only signals in the direction of the trend deserve attention. The Moving Average Convergence/Divergence indicator subtracts a longer exponential average from a shorter one and smooths the result with a signal line, combining trend and momentum features.",
  vocab: [["Stochastics", "An oscillator comparing the latest close to the recent high-low range, shown by %K and %D lines."], ["%K and %D", "The fast and smoothed lines of the stochastic oscillator."], ["Williams %R", "A range-based oscillator similar to stochastics but plotted on an inverted scale."], ["MACD", "A momentum indicator based on the difference between two exponential averages."], ["Signal line", "A moving average of the MACD line used for crossover cues."]],
  q: ["How does the stochastic oscillator relate the close to the recent range?", "Why should oscillator signals be filtered by the trend?", "How is a MACD line built and what does its signal line add?", "What conditions make oscillators most useful?", "How would you decide whether a stochastic crossover in the overbought area is worth acting on?"],
  chart: [{ k: "range", cap: "Simulated range with an oscillator.", osc: true, q: "Where would an oscillator-based entry have worked well here and why?" }, { k: "up", cap: "Simulated uptrend with an oscillator.", osc: true, q: "Which oscillator signals would you ignore and which would you take if you are only trading in the trend direction?" }],
  disc: "You are fighting a strong trend using an oscillator. What rule helps you stop doing that?" },
28: { title: "MACD Histogram, Weekly Confirmation and Contrary Opinion",
  obj: ["Read the MACD histogram", "Combine weekly and daily signals", "Explain contrary opinion and sentiment readings"],
  explain: "The MACD histogram plots the gap between the MACD line and its signal line, so it shows changes in momentum before the lines themselves cross. Combining time frames reduces mistakes: let the weekly chart set the direction and use the daily chart to time entries in that direction. Contrary opinion is the idea that when nearly everyone leans the same way, little fuel is left for the crowd to push price further, so extremes in sentiment can mark turning points. Surveys of advisors and similar sentiment gauges are used in this way. Extremes can persist, so sentiment is a supporting clue that needs price confirmation before it carries weight.",
  vocab: [["MACD histogram", "A bar plot of the difference between MACD and its signal line."], ["Contrary opinion", "Using extreme crowd sentiment as a possible sign of a turning point."], ["Sentiment", "The prevailing attitude of market participants, often measured by surveys or positioning."], ["Multiple time frames", "Using longer charts for direction and shorter charts for timing."], ["Consensus", "The majority view among participants."]],
  q: ["What does the MACD histogram show that the lines alone may not?", "How would you combine a weekly trend and a daily oscillator?", "Explain contrary opinion in your own words and one weakness of it.", "Why is sentiment alone not enough to take a trade?", "How can an extreme in advisors' bullishness be consistent with a trend continuing?"],
  chart: [{ k: "pull", cap: "Simulated trend with pullback and a MACD pane.", macd: true, q: "Describe how the histogram behaved at the pullback low and what it signaled." }, { k: "up", cap: "Simulated uptrend with MACD.", macd: true, q: "Where would a weekly-uptrend filter allow only buy signals on the daily chart?" }],
  disc: "Everyone around you is bullish and so are you. What is your plan for recognizing when your own bias is the signal?" },
29: { title: "Point and Figure Charting: Basics",
  obj: ["Explain what a point and figure chart ignores and shows", "Contrast it with a bar chart", "Introduce construction and the horizontal count"],
  explain: "Point and figure charts record only price changes of a chosen size, ignoring time and, in the basic form, volume. Columns of X represent rising prices and columns of O falling prices; a new column begins only when price reverses by a set number of boxes. This filters out small moves, so the chart shows supply and demand zones clearly and produces clean support and resistance lines. Because there is no time axis, a quiet month and an active week can look similar, and the chart changes only when price moves enough. The horizontal count estimates a price objective from the width of a congestion area. You need to choose a box size and a reversal amount, and they change what the chart shows.",
  vocab: [["Point and figure chart", "A chart of Xs (rising) and Os (falling) that ignores time."], ["Box size", "The price change each X or O represents."], ["Reversal amount", "The number of boxes price must move against the trend to start a new column."], ["Column", "A vertical series of Xs or Os in one direction."], ["Horizontal count", "A method for projecting a price target from the width of a congestion area."]],

31: { title: "Point and Figure: Patterns, Construction and Trendlines",
  obj: ["Describe common point and figure signals", "Explain construction of a 3-box reversal chart", "Draw point and figure trendlines"],
  explain: "On a point and figure chart, a buy signal appears when a column of Xs rises above the prior column of Xs (a double top breakout) and a sell signal when a column of Os falls below the prior column of Os. Patterns such as triple tops, catapults and triangles are read in the same logic as bar charts, but with cleaner lines. The popular construction uses a 3-box reversal: you add Xs while price rises, and only start a new column of Os when price falls by three boxes. Trendlines are drawn at 45 degrees, in the sense that each box is equal in height and width: a bullish support line rises from a low one box per column, and a break signals a change. Choice of box size controls sensitivity.",
  vocab: [["Double top breakout", "A buy signal when an X column exceeds the prior X column's high."], ["Double bottom breakdown", "A sell signal when an O column falls below the prior O column's low."], ["3-box reversal", "A chart requiring a three-box move against the trend to start a new column."], ["45-degree trendline", "A trendline at one box per column on a P&F chart."], ["Catapult", "A buy signal pattern that follows a breakout and a pullback, followed by a second breakout."]],
  q: ["What constitutes a basic buy signal and sell signal on a P&F chart?", "How does a 3-box reversal chart decide when to switch columns?", "Why are P&F trendlines drawn at 45 degrees?", "How does a bigger box size change the chart and the signals?", "Compare P&F pattern reading with bar chart reading in two ways."],
  chart: [{ k: "up", cap: "Simulated uptrend as a P&F chart.", fmt: "pf", q: "Mark a double top breakout. Where would a 45-degree support line start?" }, { k: "hs", cap: "Simulated top converted to P&F.", fmt: "pf", q: "Identify the breakdown. How does the chart show the shift in control?" }],
  disc: "A signal appears on the P&F chart but not on the bar chart. How do you reconcile them and decide whether to act?" },
32: { title: "P&F Objectives, Tactics, Indicators and Strengths",
  obj: ["Describe measuring techniques and trading tactics on P&F", "List advantages of point and figure", "Introduce P&F indicators and moving averages"],
  explain: "Measuring techniques in point and figure use counts: the horizontal count measures the width of a congestion area to project an objective, and the vertical count uses the height of a thrust. These are estimates, to be used with caution. Tactics emphasize buying on breakouts and on pullbacks to support lines, with stops placed under recent column lows. Advantages include clear signals, noise reduction, easy identification of support and resistance, and a built-in discipline because the chart ignores time. Computers make P&F charting fast, and P&F versions of indicators such as moving averages and relative strength are available. Whichever chart you use, define entries, stops and objectives before you trade.",
  vocab: [["Vertical count", "A method projecting an objective from the height of a column."], ["Congestion area", "A sideways region in which many columns trade within the same range."], ["Price objective", "A target estimated from the pattern's size."], ["P&F relative strength", "A comparison of two markets' price ratio shown on a P&F chart."], ["Noise", "Small price fluctuations that do not change the larger picture."]],
  q: ["How does the horizontal count project an objective?", "What stop would be consistent with a P&F breakout buy?", "Name three advantages of point and figure charting.", "Why might P&F add discipline for a trader?", "What are the risks of relying on measured objectives?"],

  disc: "Your objective is hit and you want to hold for more. Write the rule that decides between taking profit and trailing the stop." },
33: { title: "Japanese Candlesticks: Basics and Pattern Analysis",
  obj: ["Read a candlestick body and shadows", "Describe basic candle types", "Explain filtering candle patterns with trend and context"],
  explain: "A candlestick shows open, high, low and close like a bar, but draws a body between open and close and thin lines called shadows to the extremes. A hollow or white body means the close was above the open, and a filled or black body means it closed below. Long bodies show strong control, small bodies show indecision, and long shadows show rejection of prices. Basic candles include the doji, hammer, hanging man and shooting star, each defined by shape and where it appears. Patterns that span several candles, such as engulfing and star formations, are more informative when they appear after a clear trend and at meaningful levels. Filtering by trend, location and confirmation reduces false signals.",
  vocab: [["Real body", "The part of a candle between the open and close."], ["Shadow (wick)", "A thin line showing the range beyond the body."], ["Doji", "A candle whose open and close are nearly equal, signaling indecision."], ["Hammer", "A small-bodied candle with a long lower shadow after a decline."], ["Engulfing pattern", "A candle whose body covers the previous candle's body, signaling a possible shift."]],
  q: ["What do the body and shadows tell you in a candlestick?", "Why can the same candle shape mean different things in different locations?", "What does a doji suggest and what should you wait for?", "Why is a hammer after a long decline more meaningful than in a sideways market?", "Describe how filtering by trend and level could reduce false signals."],
  chart: [{ k: "pull", cap: "Simulated candles with a pullback.", fmt: "candle", q: "Find a candle that shows rejection of lower prices. What would confirm it?" }, { k: "dtop", cap: "Simulated double top as candles.", fmt: "candle", q: "Where do the candles show indecision or reversal and how does context support it?" }],
  disc: "A beautiful candle pattern appears in the middle of a range. How do you decide whether it is worth a trade?" },
34: { title: "Candle Pattern Reference and Candlestick Discipline",
  obj: ["Use the pattern reference without memorizing blindly", "Group patterns as reversal, continuation and indecision", "Build a simple, written candle-trading rule"],
  explain: "The book's candle-pattern reference is a catalog meant for lookup, not memorization. A practical way to organize it is by what the pattern implies: reversal patterns (hammers, shooting stars, engulfing, morning and evening stars), continuation patterns (rising or falling three methods, gaps within a trend) and indecision patterns (dojis, spinning tops). Within each group, ask three questions: what trend came before, what level is it at, and what happens in the next candle. A candle signal without a stop level and objective is only an observation. Because candlestick patterns are short and subjective, combine them with trend, support and resistance, and volume so you trade a setup rather than a shape.",
  vocab: [["Morning star", "A three-candle bullish reversal pattern after a decline."], ["Evening star", "A three-candle bearish reversal pattern after an advance."], ["Shooting star", "A small body with a long upper shadow after an advance."], ["Spinning top", "A small-bodied candle showing indecision."], ["Confirmation candle", "The candle after a signal that supports it."]],
  q: ["How would you group candle patterns to make them easier to learn?", "What three questions help you evaluate a candle signal?", "Why is a candle signal without a stop an observation, not a trade?", "How could you combine candle signals with support and resistance?", "What is a danger in relying on dozens of named patterns?"],
  chart: [{ k: "revday", cap: "Simulated candles with a reversal.", fmt: "candle", q: "Name the pattern you see and the trend before it. What confirmation would you want?" }, { k: "chop", cap: "Simulated candles in a noisy range.", fmt: "candle", q: "Why would many candle patterns here be unreliable?" }],
  disc: "You want to memorize 40 patterns before trading. What smaller set could you master first, and why does depth beat breadth?" }
});

36: { title: "Elliott Wave Theory: Impulse and Corrective Waves",
  obj: ["Describe the basic five-wave and three-wave structure", "Explain how Elliott Wave relates to Dow Theory", "Recognize the rules and the subjectivity of wave counts"],
  explain: "Elliott Wave Theory proposes that markets move in repeating patterns of crowd psychology: a trend advances in five waves (three with the trend and two corrections) and is then corrected in three waves. The five-wave impulse has rules; for example, wave 2 cannot retrace all of wave 1, wave 3 is never the shortest, and wave 4 should not overlap wave 1's territory in the standard form. Corrections have several forms, such as zigzags, flats and triangles. Waves nest within larger waves, much like Dow Theory's trends within trends. The weakness is subjectivity: different analysts can count the same chart differently, and a count can be revised after the fact. Treat counts as a structured hypothesis with a clear level where it is wrong.",
  vocab: [["Impulse wave", "A five-wave advance (or decline) in the direction of the larger trend."], ["Corrective wave", "A three-wave move against the larger trend."], ["Wave count", "An analyst's labeling of the waves on a chart."], ["Zigzag", "A sharp three-wave correction."], ["Invalidation level", "The price at which a wave count is wrong."]],
  q: ["Describe the five-wave and three-wave structure in your own words.", "State two rules of the standard impulse and why they exist.", "How is Elliott Wave related to Dow Theory's idea of trends inside trends?", "Why is subjectivity a main criticism and how can you manage it?", "What does an invalidation level do for a wave-based idea?"],
  chart: [{ k: "ell", cap: "Simulated five-wave advance and three-wave correction.", q: "Label waves 1 to 5 and A-B-C. Which rules are satisfied?" }, { k: "pull", cap: "Simulated trend and correction.", q: "Offer two plausible counts. Where would each be proven wrong?" }],
  disc: "Your count says a big move is coming and you want to take a large position. How does the possibility of a different valid count shape your sizing?" },
37: { title: "Fibonacci Ratios, Time Targets and Elliott in Practice",
  obj: ["Explain Fibonacci numbers and ratios in the wave principle", "Use retracement and extension ideas with caution", "Compare use in stocks versus commodities"],
  explain: "Elliott's followers link the wave structure to the Fibonacci sequence, in which each number is the sum of the previous two, and to its ratios, especially 0.382, 0.5 (a common retracement benchmark) and 0.618. Retracement levels estimate where a correction may end; extensions estimate how far a trending wave may travel; time targets look for turning points a Fibonacci number of bars apart. Channeling and wave 4 as a support area give additional reference points, and the rule of alternation suggests that corrective waves tend to differ in form. These tools are most credible when several of them converge at one price. Skeptics note that many ratios give many levels, so something will always line up; use convergence with other evidence, not a single ratio.",
  vocab: [["Fibonacci sequence", "A number series where each term is the sum of the previous two."], ["Fibonacci retracement", "Percentage levels such as 38.2%, 50% and 61.8% used to estimate correction targets."], ["Extension", "A projected target beyond the prior high or low, often based on ratios."], ["Rule of alternation", "The idea that corrective waves differ from one another in form."], ["Convergence", "Several independent measures pointing to the same price or time."]],
  q: ["What is the Fibonacci sequence and why do some analysts use its ratios?", "How can a retracement level be used to plan a pullback entry and a stop?", "Why is convergence of several tools more meaningful than one ratio?", "What is the criticism that 'there are so many levels that one always works'?", "Why might the wave principle be applied differently to stocks and commodities?"],
  chart: [{ k: "pull", cap: "Simulated rally and correction.", q: "Draw 38.2%, 50% and 61.8% retracements of the rally. Where did price turn? Does another tool agree?" }, { k: "ell", cap: "Simulated wave structure.", q: "Where would a wave-4 support idea apply and what would invalidate it?" }],
  disc: "Ratios give you six levels in a tight area. How do you avoid cherry-picking the one that fits your bias?" },
38: { title: "Time Cycles: Concepts and Terminology",
  obj: ["Define a cycle and its key features", "Explain how cycles relate to charting techniques", "Describe the idea of nominal and dominant cycles"],
  explain: "A cycle is a recurring pattern of highs and lows that appears at roughly regular time intervals. Cycles have length (from trough to trough), amplitude (size) and phase (position in the cycle). The principle of harmonicity suggests that cycle lengths relate by simple ratios such as two, the principle of synchronicity suggests that cycle lows often line up across lengths, and proportionality links cycle length to amplitude. Cycle thinking helps explain why many charting tools work: moving averages, trendlines and oscillators capture cyclical swings. The trouble is that real cycles drift in length, so cycle forecasts are approximate and best used for time zones rather than exact dates.",
  vocab: [["Cycle", "A recurring pattern of price swings spaced at roughly regular intervals."], ["Amplitude", "The size of a cycle's swing."], ["Phase", "Where the market is within its cycle."], ["Nominal cycle length", "The average or expected length of a cycle."], ["Harmonicity", "The tendency of related cycles to have lengths in simple ratios."]],
  q: ["Define the length, amplitude and phase of a cycle.", "Why are cycle forecasts better viewed as time zones than exact dates?", "How do cyclic ideas help explain why moving averages and oscillators work?", "What is the principle of harmonicity?", "What is the risk of assuming a cycle length will stay constant?"],
  chart: [{ k: "cyc", cap: "Simulated price with a repeating cycle.", q: "Measure the distance between successive lows. How regular is the cycle and what happens if one low is late?" }, { k: "up", cap: "Simulated trend with minor cycles.", q: "Describe how cycle lows relate to a trendline and what a failure of a low to hold means." }],
  disc: "A cycle says a low is due next week. What would you require from price action before acting on it?" },
39: { title: "Dominant Cycles, Translation and Isolating Cycles",
  obj: ["Explain dominant cycles and combining cycle lengths", "Interpret left and right translation", "Describe how cycles can be isolated and used with trend"],
  explain: "Several cycles operate at once, and the dominant cycle is the one that most strongly shapes the market. Adding cycles of different lengths shows why highs and lows sometimes cluster. Translation describes where a cycle's peak occurs: right translation (the peak comes later in the cycle) is generally associated with a bullish trend, and left translation (an early peak) with a bearish one. Isolating cycles can be done by eye, with detrending, or with software. Importantly, trend still matters: cycles help with timing, but a strong trend overrides a cycle's expected low. Use cycles as one input and not as a standalone system.",
  vocab: [["Dominant cycle", "The cycle that most strongly influences price at a given time."], ["Right translation", "A cycle peak occurring in the later part of the cycle, usually bullish."], ["Left translation", "A cycle peak occurring early, usually a bearish sign."], ["Detrending", "Removing the trend so cycles stand out."], ["Time window", "A range of dates where a turning point is expected."]],
  q: ["What is a dominant cycle and why might it change over time?", "Explain left and right translation and what each suggests.", "How might several cycles combine to make a turning point more likely?", "Why does trend matter when using cycles?", "What would you do if the cycle low did not hold?"],
  chart: [{ k: "cyc", cap: "Simulated trend with cycles.", q: "Mark cycle highs and lows and say whether translation is left or right." }, { k: "up", cap: "Simulated strong trend.", q: "A cycle model says a low is due. Why might the trend override it and what would you do?" }],
  disc: "A cycle low arrives exactly as predicted once and you start to over-trust it. How do you test cycle claims objectively?" }
});
