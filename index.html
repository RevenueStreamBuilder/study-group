41: { title: "Seasonal and Stock Market Cycles; Computers in Analysis",
  obj: ["Describe seasonal and stock market cycle ideas", "Explain MESA and cycle software at a high level", "Describe the role of computers and indicator grouping"],
  explain: "Some markets show seasonal tendencies tied to growing seasons, weather or the calendar. Stock market ideas include the four-year presidential cycle and the January barometer, which treats January's direction as a hint for the year. These are historical tendencies, not laws; they have exceptions and may fade once widely known. Maximum entropy spectral analysis and other software can search for dominant cycles, but results depend on the data and settings. Chapter 15 then turns to computers and trading systems. Computers speed charting, scanning and testing, and indicators can be grouped by purpose (trend, momentum, volume, sentiment) so that you use one tool from each group instead of five that say the same thing.",
  vocab: [["Seasonal cycle", "A tendency for prices to rise or fall at certain times of year."], ["Presidential cycle", "The idea that stocks follow a four-year pattern tied to US elections."], ["January barometer", "The idea that January's direction predicts the year's direction."], ["Spectral analysis", "A computational method for detecting repeating cycles in data."], ["Indicator grouping", "Organizing tools by purpose to avoid redundancy."]],
  q: ["Why might a seasonal tendency exist, and why might it stop working?", "What is a sensible attitude toward the presidential cycle and the January barometer?", "What do software cycle tools offer and what is the risk of relying on them?", "Why group indicators by type instead of stacking similar ones?", "Name one thing a computer does well and one thing it cannot do for you."],
  chart: [{ k: "cyc", cap: "Simulated series with a seasonal pattern.", q: "Mark where the seasonal lows occur. How reliable does the pattern look and how would you test it?" }, { k: "up", cap: "Simulated trend.", q: "Name one trend, one momentum and one volume indicator you would pick for this chart and why they are not redundant." }],
  disc: "A seasonal tendency suggests a trade but the chart disagrees. What does your rule hierarchy say?" },
42: { title: "Wilder's Systems, Pros and Cons of Systems and Testing",
  obj: ["Describe the ideas behind Wilder's parabolic and directional movement systems", "Weigh pros and cons of system trading", "Explain why testing matters"],
  explain: "Welles Wilder created several widely known tools. The Parabolic system uses a trailing stop that accelerates as a trend matures, and the Directional Movement system measures whether upward or downward movement is dominant and how strong the trend is. Both are trend-following and perform best when markets trend; in sideways markets they whipsaw. System trading brings discipline, consistency and testability, but it can be rigid, can overfit past data, and cannot know about changes in market behavior. Some traders use a system as a screen and apply judgment afterward. Whether you buy a system or build one, test it on data it was not designed on, include realistic costs, and understand its worst losing streak before trading it.",
  vocab: [["Parabolic system", "A trend-following system with an accelerating trailing stop."], ["Directional Movement (DMI/ADX)", "Indicators measuring trend direction and strength."], ["Trend-following", "A method that aims to ride existing trends and accepts whipsaws in ranges."], ["Out-of-sample test", "Testing on data not used to design the system."], ["Drawdown", "The decline from an equity peak to a subsequent trough."]],
  q: ["What type of market suits trend-following systems and where do they struggle?", "List two benefits and two risks of system trading.", "Why is out-of-sample testing important?", "Why should realistic costs be included in a test?", "How would you decide whether a worst-case drawdown is tolerable for you?"],
  chart: [{ k: "chop", cap: "Simulated choppy market.", q: "How would a trend-following system perform here and what filter might help?" }, { k: "up", cap: "Simulated trend.", q: "Where would a trailing stop have kept you in the trend and where might it have exited early?" }],
  disc: "A system hits a losing streak that your backtest said was possible. How do you decide whether to follow the plan or stop?" },
43: { title: "Money Management and Risk Controls",
  obj: ["Name the three elements of successful trading", "Apply fixed-risk position sizing", "Explain reward-to-risk ratios and multiple positions"],
  explain: "Successful trading rests on three elements: a sound method, risk control and discipline. Money management is the second, and it is what keeps a trader in the game. A common approach is to risk a small fixed percentage of equity on each trade, so that position size follows from the distance between entry and stop. Reward-to-risk compares the expected gain to the amount risked; a ratio of 2 to 1 or better gives you room to be wrong often. Trading several positions raises the question of total exposure and correlation. After winning or losing streaks, discipline means keeping size consistent instead of increasing size on a hot streak or revenge trading after a loss. Never risk money you need for living expenses, a mortgage or an emergency fund.",
  vocab: [["Position sizing", "Choosing how many shares or contracts to trade based on risk."], ["Risk per trade", "The amount (or percent of equity) you will lose if the stop is hit."], ["Reward-to-risk ratio", "Potential profit divided by potential loss."], ["Stop-loss", "A preset exit that limits the loss on a trade."], ["Exposure", "The total amount of capital at risk across open positions."]],
  q: ["Why is risk control the part of trading you fully control?", "Explain how entry, stop and risk percentage determine position size.", "Why can a 2-to-1 reward-to-risk ratio allow a trader to win less than half the time and still profit?", "How does holding several correlated positions change true risk?", "How should you adjust (or not adjust) position size after a winning or losing streak?"],
  chart: [{ k: "brk", cap: "Simulated breakout.", q: "Choose an entry, a stop and a target. Compute the reward-to-risk and the position size for a 1% risk on a $10,000 simulated account." }, { k: "fbrk", cap: "Simulated failed breakout.", q: "Where would your stop have been hit? Calculate the dollar loss on the same sizing." }],
  disc: "After three wins you feel invincible and want to double your size. Write the rule that keeps your size consistent, and state what the three wins actually tell you." },
44: { title: "Trading Tactics, Orders and Intraday Charts",
  obj: ["Describe common order types and when to use them", "Explain moving from daily to intraday charts", "Summarize money-management guidelines and asset allocation basics"],
  explain: "Execution matters. A market order fills now at the best available price, a limit order fills only at your price or better, and a stop order becomes a market order once price touches your trigger. Slippage is the difference between the price you expected and the price you got, and it can be larger in fast or thin markets. Intraday charts add detail but also noise; pivot points offer reference levels derived from the prior session. The money-management chapter summarizes guidelines such as limiting risk per trade, using stops, avoiding overtrading and keeping records. For stock investors, asset allocation divides funds among asset classes, which is separate from, and complementary to, trade-level risk control. The chapter also introduces the market profile approach.",
  vocab: [["Market order", "An order to trade immediately at the best available price."], ["Limit order", "An order to trade only at a specified price or better."], ["Stop order", "An order that becomes a market order when a trigger price is touched."], ["Slippage", "The difference between the expected and actual execution price."], ["Pivot point", "A reference level computed from the previous period's high, low and close."]],
  q: ["Compare market, limit and stop orders and a situation for each.", "What is slippage and why does it matter more for short-term traders?", "Why are intraday charts noisier than daily charts and how does that change your approach?", "How does asset allocation differ from per-trade risk control?", "Why keep a written record of trades and decisions?"],
  chart: [{ k: "up", cap: "Simulated trend with an entry zone.", q: "Which order type would you use to enter on a pullback and where would you place the stop order?" }, { k: "chop", cap: "Simulated intraday-style chop.", q: "Explain why you might skip trading here and what rule makes that decision objective." }],
  disc: "You hit a stop and immediately re-enter at a worse price out of frustration. Describe a rule that blocks revenge trading." }
});

46: { title: "Intermarket Analysis: Bonds, Commodities, the Dollar and Stocks",
  obj: ["Describe the main intermarket relationships", "Explain relative strength analysis", "Apply a top-down approach from markets to sectors to stocks"],
  explain: "Markets influence each other, and intermarket analysis studies those links. In the classic picture, bond prices tend to move with stocks, commodity prices tend to move opposite to bonds, and the dollar tends to move opposite to commodities. Such relationships are tendencies that change with the economic environment, so you check them on current charts instead of assuming them. Relative strength analysis divides one market by another to see which is leading; a rising ratio means the numerator is outperforming. A top-down approach starts with the broad markets and economy, then the strongest sectors, then the strongest stocks in those sectors. Program trading links stock and futures prices mechanically, which is why index futures and stocks can move together quickly.",
  vocab: [["Intermarket analysis", "Studying how different markets (bonds, commodities, currencies, stocks) influence each other."], ["Relative strength", "A ratio of one market or stock to another showing which is outperforming."], ["Sector rotation", "Money moving among industry groups as the economy changes."], ["Top-down approach", "Starting from the broad market, then sectors, then individual stocks."], ["Program trading", "Computer-driven trading linking baskets of stocks and index futures."]],
  q: ["Describe the classic relationships between bonds, stocks, commodities and the dollar, and why you must check them.", "What does a rising relative-strength ratio tell you?", "Explain the top-down approach in three steps.", "Why might sector leadership matter for an individual stock trade?", "What is program trading and how does it link stocks and futures?"],
  chart: [{ k: "up", cap: "Simulated ratio of a stock to the market.", q: "The ratio is rising while the market is flat. What does that say about this stock and what would break the idea?" }, { k: "down", cap: "Simulated falling ratio.", q: "What does a persistently falling ratio suggest about a holding and what action might you consider?" }],
  disc: "Your favorite stock is weak relative to its sector but you like the story. How do you handle the conflict?" },
47: { title: "Intermarket Correlation and Stock Market Breadth",
  obj: ["Discuss intermarket correlation and its limits", "Explain market breadth and the advance-decline line", "Describe the McClellan Oscillator at a conceptual level"],
  explain: "Correlation tells you how closely two markets move together, but it changes over time and can break down. Software that studies intermarket relationships, including neural networks, is a tool, not an oracle. Market breadth measures how many stocks participate in a move. The advance-decline line cumulates the difference between advancing and declining issues; a healthy rally has the line confirming new highs in the index. A divergence, where an index makes a new high but the advance-decline line does not, shows narrowing participation and is a warning. The McClellan Oscillator and Summation Index smooth advancing and declining issues to measure breadth momentum. As always, breadth is evidence to weigh with trend and levels, not a trigger on its own.",
  vocab: [["Correlation", "A statistical measure of how closely two series move together."], ["Market breadth", "The number of stocks participating in a market move."], ["Advance-decline line", "A cumulative total of advancing minus declining issues."], ["McClellan Oscillator", "A breadth momentum indicator based on smoothed advances minus declines."], ["Narrow participation", "A rally led by few stocks, a sign of weaker breadth."]],
  q: ["Why can correlations break down over time?", "How is the advance-decline line built and what does it show?", "What does it mean if an index makes a new high but the advance-decline line does not?", "How would you describe the McClellan Oscillator to a beginner?", "Why should breadth be combined with price evidence?"],
  chart: [{ k: "up", cap: "Simulated index rising; imagine its advance-decline line flattening.", q: "Describe the divergence and what you would do to the size of new long positions." }, { k: "wedge", cap: "Simulated narrowing rally.", q: "How might narrow participation show up in price behavior?" }],
  disc: "Breadth is weakening but your system keeps giving buy signals. What does your plan say and what does ignoring breadth cost or save?" },
48: { title: "New Highs/Lows, Volume Breadth, the Arms Index and Equivolume",
  obj: ["Interpret new highs and new lows", "Explain upside/downside volume and the Arms Index", "Describe equivolume and candlepower"],
  explain: "The count of stocks making new highs compared with those making new lows gives another breadth reading, and a shrinking number of new highs in a rising market is a caution. Comparing upside and downside volume shows where the money is flowing. The Arms Index (TRIN) compares advances-to-declines with their volume ratio; low readings indicate strong buying pressure and high readings indicate selling pressure, and extremes may signal exhaustion. TICK measures upticks minus downticks and is useful for short-term timing. Equivolume charts widen each bar by volume so heavy trading appears wide, and candlepower combines candle bodies with volume. Comparing market averages, such as large caps versus small caps, helps judge the market's health.",
  vocab: [["New high/new low", "Counts of stocks reaching 52-week extremes, used as a breadth measure."], ["Upside/downside volume", "Volume in advancing versus declining stocks."], ["Arms Index (TRIN)", "A ratio combining advance-decline and volume breadth."], ["TICK", "The net number of stocks trading on upticks versus downticks."], ["Equivolume", "A chart where bar width reflects volume."]],
  q: ["What does shrinking new highs during a rising index suggest?", "What does comparing upside with downside volume add to advance-decline data?", "How is an extreme Arms Index reading interpreted?", "How does an equivolume bar show conviction?", "Why compare large-cap and small-cap averages?"],
  chart: [{ k: "blow", cap: "Simulated climax rally.", vol: true, q: "What breadth or volume extreme would you expect near the climax and how might it look different from earlier rallies?" }, { k: "brk", cap: "Simulated range breakout.", vol: true, q: "Does volume agree with the breakout and what would a divergence look like?" }],
  disc: "Short-term indicators like TICK tempt you to over-trade. How do you limit frequency without missing good setups?" },
49: { title: "Pulling It All Together: A Checklist",
  obj: ["Describe a technical checklist and why to use one", "Explain coordinating technical and fundamental analysis", "Recognize the professional context of technical analysis"],
  explain: "By now you have many tools, and the risk is using all of them at random. A checklist turns them into a process: what is the long-term trend, where are major support and resistance, what is the intermediate trend, what do patterns and indicators say, how do volume, breadth and related markets agree, where is the entry, the stop and the target. Technical and fundamental views can be coordinated: fundamentals can suggest what to look at and technicals when to act. The chapter also covers the profession, such as the CMT designation and the Market Technicians Association, and the global use of technical analysis. A checklist protects against overconfidence because it forces you to find evidence on both sides before you act.",
  vocab: [["Checklist", "A written list of questions answered before every trade."], ["CMT", "Chartered Market Technician, a professional designation."], ["MTA", "Market Technicians Association, a professional body for technical analysts."], ["Confluence", "Several independent signals agreeing at the same place or time."], ["Process", "A repeatable set of steps for analyzing and acting."]],
  q: ["Why does a written checklist reduce errors compared with doing it from memory?", "List the first five questions you would put on your own checklist and justify the order.", "How can fundamentals and technicals work together?", "What is the difference between confluence and cherry-picking?", "What should a checklist say about when not to trade?"],
  chart: [{ k: "pull", cap: "Simulated trend and pullback.", q: "Apply your checklist: trend, levels, pattern, indicators, volume. Where do you find agreement and conflict?" }, { k: "chop", cap: "Simulated messy chart.", q: "Run the same checklist. Which items fail and what is the correct action?" }],
  disc: "You are excited about a trade and want to skip the checklist. What does that feeling tell you, and what is your rule?" }
});

Object.assign(LESSONS, {
51: { title: "Appendix A: Advanced Indicators",
  obj: ["Describe the purpose of the Demand Index and Herrick Payoff Index", "Explain Starc Bands and Keltner Channels", "Decide when advanced indicators add value"],
  explain: "The first appendix introduces indicators that blend price with volume or volatility. The Demand Index combines price and volume data to estimate buying versus selling pressure, and divergences from price are the usual way it is read. The Herrick Payoff Index, designed for futures, uses price, volume and open interest to estimate money flow. Starc Bands and Keltner Channels place bands around a moving average using average true range or similar measures of volatility, so they widen in volatile markets and narrow in quiet ones, like Bollinger Bands but with a different calculation. Advanced does not mean better: each added indicator brings more settings and more risk of overfitting. Add one only if it answers a question your current tools cannot.",
  vocab: [["Demand Index", "An indicator combining price and volume to estimate buying and selling pressure."], ["Herrick Payoff Index (HPI)", "A futures indicator combining price, volume and open interest to gauge money flow."], ["Keltner Channel", "A volatility-based channel around a moving average."], ["Average true range (ATR)", "A measure of average price range including gaps."], ["Indicator redundancy", "Using several tools that measure the same thing."]],
  q: ["What question does the Demand Index try to answer?", "Why does the Herrick Payoff Index use open interest, and for which markets?", "How do Keltner Channels differ in construction from Bollinger Bands?", "Why does adding more indicators not guarantee better decisions?", "What test would you apply before adding a new indicator to your playbook?"],
  chart: [{ k: "up", cap: "Simulated trend with volatility bands.", bb: true, q: "Describe how bands behave when volatility rises and how that could affect a stop distance." }, { k: "wedge", cap: "Simulated wedge with an oscillator.", osc: true, q: "If a volume-based indicator diverged here, what would you do with your existing position?" }],
  disc: "A new indicator seems to fit past charts perfectly. What would make you pause before adding it?" },
52: { title: "Appendix B: Market Profile (Part 1)",

/* Risk and trade-math helpers (pure functions; unit-tested in tests/test_calc.js). All trades are hypothetical simulations. */
const Calc = (function () {
  const num = (x) => (typeof x === "number" ? x : parseFloat(x));
  const ok = (...a) => a.every((v) => Number.isFinite(v));
  const round = (v, d = 2) => (Number.isFinite(v) ? Math.round(v * Math.pow(10, d)) / Math.pow(10, d) : NaN);

  // Position size from a fixed percent risk. Long or short is inferred from entry vs stop.
  function positionSize(o) {
    const equity = num(o.equity), riskPct = num(o.riskPct), entry = num(o.entry), stop = num(o.stop);
    const costPerUnit = Number.isFinite(num(o.costPerUnit)) ? num(o.costPerUnit) : 0; // round-trip commission+slippage per unit
    if (!ok(equity, riskPct, entry, stop) || equity <= 0 || riskPct <= 0) return { valid: false, error: "Enter equity, risk %, entry and stop." };
    const perUnit = Math.abs(entry - stop);
    if (perUnit === 0) return { valid: false, error: "Entry and stop cannot be equal." };
    const riskAmount = equity * riskPct / 100;
    const effPerUnit = perUnit + Math.max(0, costPerUnit);      // costs make the real loss larger
    const units = Math.floor(riskAmount / effPerUnit);
    const positionValue = units * entry;
    const plannedMaxLoss = units * effPerUnit;
    return { valid: true, side: entry > stop ? "long" : "short", riskAmount: round(riskAmount), perUnitRisk: round(perUnit, 4), units, positionValue: round(positionValue), plannedMaxLoss: round(plannedMaxLoss), pctOfEquityInPosition: round(positionValue / equity * 100), maxLossPctOfEquity: round(plannedMaxLoss / equity * 100, 3) };
  }

  function rewardRisk(o) {
    const entry = num(o.entry), stop = num(o.stop), target = num(o.target);
    if (!ok(entry, stop, target)) return { valid: false };
    const risk = Math.abs(entry - stop), reward = Math.abs(target - entry);
    if (risk === 0) return { valid: false, error: "Entry and stop cannot be equal." };
    const dirOk = (entry > stop && target > entry) || (entry < stop && target < entry);
    return { valid: true, ratio: round(reward / risk, 2), risk: round(risk, 4), reward: round(reward, 4), directionOk: dirOk, breakevenWinRate: round(100 / (1 + reward / risk), 1) };
  }

  // Expectancy per trade. winRate as percent (0-100). avgWin and avgLoss positive numbers (dollars or R).
  function expectancy(o) {
    const w = num(o.winRate) / 100, aw = num(o.avgWin), al = Math.abs(num(o.avgLoss));
    if (!ok(w, aw, al) || w < 0 || w > 1) return { valid: false };
    const e = w * aw - (1 - w) * al;
    return { valid: true, perTrade: round(e, 3), profitFactor: al * (1 - w) === 0 ? Infinity : round((w * aw) / ((1 - w) * al), 2), per100: round(e * 100, 1) };
  }

  // Drawdown from an equity series (array of numbers) -> max peak-to-trough % and recovery needed.
  function drawdown(series) {
    const s = (series || []).map(num).filter(Number.isFinite);
    if (s.length < 2) return { valid: false };
    let peak = s[0], peakIdx = 0, maxDD = 0, ddPeak = 0, ddTrough = 0;
    for (let i = 0; i < s.length; i++) {
      if (s[i] > peak) { peak = s[i]; peakIdx = i; }
      const dd = (peak - s[i]) / peak;
      if (dd > maxDD) { maxDD = dd; ddPeak = peakIdx; ddTrough = i; }
    }
    return { valid: true, maxDrawdownPct: round(maxDD * 100, 2), peakIndex: ddPeak, troughIndex: ddTrough, recoveryNeededPct: maxDD >= 1 ? Infinity : round(maxDD / (1 - maxDD) * 100, 2), currentDrawdownPct: round((peak - s[s.length - 1]) / peak * 100, 2) };
  }
  const recoveryNeeded = (ddPct) => { const d = num(ddPct) / 100; return d >= 1 || !Number.isFinite(d) ? Infinity : round(d / (1 - d) * 100, 2); };

  // Effect of commission and slippage (per unit, per side) on a trade plan.
  function costImpact(o) {
    const entry = num(o.entry), stop = num(o.stop), target = num(o.target), units = num(o.units);
    const comm = Math.max(0, num(o.commissionPerUnit) || 0), slip = Math.max(0, num(o.slippagePerUnit) || 0);
    if (!ok(entry, stop, target, units) || units <= 0) return { valid: false };
    const perSide = comm + slip, roundTrip = 2 * perSide;
    const risk = Math.abs(entry - stop), reward = Math.abs(target - entry);
    const effRisk = risk + roundTrip, effReward = Math.max(0, reward - roundTrip);
    return { valid: true, roundTripCostPerUnit: round(roundTrip, 4), totalCost: round(roundTrip * units), grossRR: round(reward / risk, 2), netRR: round(effReward / effRisk, 2), effectiveMaxLoss: round(effRisk * units), effectiveGain: round(effReward * units), costPctOfReward: reward > 0 ? round(roundTrip / reward * 100, 1) : NaN };
  }
  const breakevenWinRate = (rr) => (num(rr) > 0 ? round(100 / (1 + num(rr)), 1) : NaN);
  return { positionSize, rewardRisk, expectancy, drawdown, recoveryNeeded, costImpact, breakevenWinRate, round };
})();
if (typeof module !== "undefined") module.exports = Calc;
